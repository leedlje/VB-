<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: vbbook:; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; connect-src 'self' blob: vbbook:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VB阅读器</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="brand" aria-label="VB阅读器">VB<span>阅读器</span></div>
        <button id="shelf-toggle" class="icon-button text-button" type="button">书架</button>
        <button id="import-books" class="primary" type="button" title="导入 TXT、EPUB、PDF">导入书籍</button>
        <button id="open" class="primary" type="button" title="Ctrl+O">打开 TXT</button>
        <button id="recent-toggle" class="icon-button text-button" type="button" aria-controls="recent-panel" aria-expanded="false">最近阅读</button>
        <button id="search-toggle" class="icon-button text-button" type="button" aria-controls="searchbar" aria-expanded="false" title="Ctrl+F">搜索</button>
        <button id="bookmarks-toggle" class="icon-button text-button" type="button" aria-controls="bookmarks-panel" aria-expanded="false">书签</button>
        <button id="layout-toggle" class="icon-button text-button" type="button" aria-controls="layoutbar" aria-expanded="false">排版</button>
        <div class="divider"></div>
        <label class="encoding-label" for="encoding">编码</label>
        <select id="encoding" aria-label="文字编码" disabled><option value="utf8">UTF-8</option><option value="gb18030">GB18030</option></select>
        <div class="spacer"></div>
        <div class="appearance-group">
          <label class="encoding-label" for="theme">主题</label>
          <select id="theme" aria-label="阅读主题"><option value="light">明亮</option><option value="dark">深色</option><option value="sepia">护眼</option></select>
          <button id="smaller" class="icon-button" type="button" aria-label="缩小字号" title="缩小字号">A−</button>
          <span id="font-size" aria-live="polite">18</span>
          <button id="larger" class="icon-button" type="button" aria-label="放大字号" title="放大字号">A＋</button>
        </div>
      </header>
      <div id="layoutbar" class="settingsbar" hidden>
        <span>行距</span><button id="line-smaller" type="button" aria-label="缩小行距">−</button><output id="line-height">1.9</output><button id="line-larger" type="button" aria-label="增大行距">＋</button>
        <span>正文宽度</span><button id="width-smaller" type="button" aria-label="缩小正文宽度">−</button><output id="content-width">820 px</output><button id="width-larger" type="button" aria-label="增大正文宽度">＋</button>
      </div>
      <div id="searchbar" class="searchbar" hidden>
        <label for="search-input">文内搜索</label><input id="search-input" type="search" placeholder="输入要查找的文字" autocomplete="off" />
        <span id="search-count" role="status" aria-live="polite">输入文字开始搜索</span>
        <button id="search-prev" type="button" disabled>上一处</button><button id="search-next" type="button" disabled>下一处</button>
      </div>
      <div id="publication-controls" class="settingsbar" hidden>
        <button id="publication-prev" type="button">上一页</button><button id="publication-next" type="button">下一页</button>
        <button id="chapters-toggle" type="button">目录</button>
        <span id="pdf-controls" hidden>第 <input id="pdf-page" type="number" min="1" value="1" aria-label="PDF 页码" /> / <output id="pdf-total">1</output> 页
        <button id="pdf-fit-page" type="button">适合页面</button><button id="pdf-fit-width" type="button">适合宽度</button>
        <button id="pdf-zoom-out" type="button">缩小</button><button id="pdf-zoom-in" type="button">放大</button></span>
      </div>
      <div class="bookbar"><span id="book-title">书架</span><span id="progress"></span></div>
      <div class="reader-layout">
      <aside id="recent-panel" class="side-panel" hidden><h2>最近阅读</h2><p id="recent-empty">还没有阅读记录。</p><ul id="recent-list"></ul></aside>
      <aside id="bookmarks-panel" class="side-panel" hidden><h2>书签</h2><button id="bookmark-add" type="button" disabled>添加当前位置</button><p id="bookmarks-empty">当前文件还没有书签。</p><ul id="bookmarks-list"></ul></aside>
      <aside id="chapters-panel" class="side-panel" hidden><h2>目录</h2><ul id="chapters-list"></ul></aside>
      <main id="viewport" class="viewport" tabindex="-1">
        <section id="shelf" class="shelf" hidden><div class="shelf-heading"><div><h1>我的书架</h1><p>本地书籍，随时接着读。</p></div></div>
          <div class="shelf-tools"><input id="shelf-search" type="search" placeholder="搜索书名" aria-label="搜索书名" />
            <select id="shelf-format" aria-label="格式筛选"><option value="all">全部格式</option><option value="txt">TXT</option><option value="epub">EPUB</option><option value="pdf">PDF</option></select>
            <select id="shelf-sort" aria-label="书架排序"><option value="recent">最近阅读</option><option value="title">书名</option></select></div>
          <p id="shelf-empty">书架还没有书。点击“导入书籍”添加 TXT、EPUB 或 PDF。</p><div id="shelf-list" class="shelf-list"></div>
        </section>
        <section id="empty" class="empty"><div class="empty-mark">书</div><h1>开始阅读</h1><p>从书架打开 TXT、EPUB 或 PDF。</p><button id="empty-open" class="primary large" type="button">导入书籍</button></section>
        <article id="content" class="content" aria-label="书籍正文" hidden></article>
        <div id="publication-view" class="publication-view" hidden></div>
      </main>
      </div>
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
